<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haa Livestock DRP Portal</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
font-family:Inter;
background:#F8FAFC;
}

.sidebar{
width:270px;
background:#0F172A;
color:white;
position:fixed;
height:100vh;
padding:25px;
}

.main{
margin-left:270px;
padding:30px;
}

.card{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.05);
margin-bottom:20px;
}

.form-input{
width:100%;
border:1px solid #cbd5e1;
padding:10px;
border-radius:10px;
}

.calc-row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr;
gap:8px;
padding:8px;
background:#F1F5F9;
border-radius:10px;
align-items:center;
}

.nav-btn{
display:block;
width:100%;
padding:8px;
margin-bottom:4px;
text-align:left;
border-radius:8px;
}

.nav-btn:hover{
background:#1E293B;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h1 class="text-xl font-black">HAA LIVESTOCK</h1>
<p class="text-xs text-blue-400 mb-6">DRP Portal</p>

<button onclick="showView('dashboard')" class="nav-btn">Dashboard</button>

<button onclick="showView('dairy')" class="nav-btn">Dairy Production</button>

<button onclick="showView('fishery')" class="nav-btn">Fishery</button>

<button onclick="showView('api')" class="nav-btn">Apiculture</button>

<button onclick="showView('nutrition')" class="nav-btn">Nutrition</button>

<button onclick="showView('sheep')" class="nav-btn">Sheep & Goat</button>

<button onclick="showView('map')" class="nav-btn">Gewog Map</button>

<button onclick="showView('analytics')" class="nav-btn">Analytics</button>

<button onclick="showView('staff')" class="nav-btn">Staff</button>

</div>


<!-- MAIN PANEL -->

<div class="main">


<!-- DASHBOARD -->

<section id="dashboard" class="view">

<div class="grid grid-cols-4 gap-4">

<div class="card">
<p>Total Dairy Revenue</p>
<h2 id="dairy_total" class="text-2xl font-bold">0</h2>
</div>

<div class="card">
<p>Honey Revenue</p>
<h2 id="honey_total" class="text-2xl font-bold">0</h2>
</div>

<div class="card">
<p>Fishery Revenue</p>
<h2 id="fish_total" class="text-2xl font-bold">0</h2>
</div>

<div class="card">
<p>Sheep Sector</p>
<h2 id="sheep_total" class="text-2xl font-bold">0</h2>
</div>

</div>

</section>


<!-- DAIRY PRODUCTION -->

<section id="dairy" class="view hidden">

<div class="card">

<h2 class="font-black mb-4">Dairy Production</h2>

<div class="calc-row">

<span>Milk (L)</span>

<input type="number" class="qty-input form-input" oninput="runAutoCalc('dairy')">

<input type="number" class="price-input form-input" oninput="runAutoCalc('dairy')">

<span>Nu <span class="subtotal-display">0</span></span>

</div>

<div class="calc-row">

<span>Butter (Kg)</span>

<input type="number" class="qty-input form-input" oninput="runAutoCalc('dairy')">

<input type="number" class="price-input form-input" oninput="runAutoCalc('dairy')">

<span>Nu <span class="subtotal-display">0</span></span>

</div>

<div class="calc-row">

<span>Cheese</span>

<input type="number" class="qty-input form-input" oninput="runAutoCalc('dairy')">

<input type="number" class="price-input form-input" oninput="runAutoCalc('dairy')">

<span>Nu <span class="subtotal-display">0</span></span>

</div>

</div>

</section>


<!-- GEWOG SATELLITE MAP -->

<section id="map" class="view hidden">

<div class="card">

<h2 class="font-black mb-4">Livestock Satellite Map</h2>

<div id="livestockMap" style="height:500px"></div>

</div>

</section>


<!-- ANALYTICS -->

<section id="analytics" class="view hidden">

<div class="card">

<h2 class="font-black mb-4">Production Analytics</h2>

<canvas id="revChart"></canvas>

</div>

</section>

</div>



<script>

function showView(id){

document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"))

document.getElementById(id).classList.remove("hidden")

}



function runAutoCalc(sector){

let total=0

const rows=document.querySelectorAll("#"+sector+" .calc-row")

rows.forEach(row=>{

const q=row.querySelector(".qty-input").value || 0

const p=row.querySelector(".price-input").value || 0

const sub=q*p

row.querySelector(".subtotal-display").innerText=sub

total+=sub

})

document.getElementById("dairy_total").innerText=total

}



</script>


<script>

const map=L.map('livestockMap').setView([27.38,89.28],10)

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'

).addTo(map)



// 6 GEWOG MARKERS

L.marker([27.42,89.30]).addTo(map).bindPopup("Bji Gewog")

L.marker([27.40,89.26]).addTo(map).bindPopup("Katsho Gewog")

L.marker([27.36,89.31]).addTo(map).bindPopup("Uesu Gewog")

L.marker([27.35,89.22]).addTo(map).bindPopup("Samar Gewog")

L.marker([27.33,89.29]).addTo(map).bindPopup("Gakiling Gewog")

L.marker([27.31,89.25]).addTo(map).bindPopup("Sangbay Gewog")

</script>



<script>

const ctx=document.getElementById("revChart")

new Chart(ctx,{
type:"bar",
data:{
labels:["Dairy","Fish","Honey","Sheep"],
datasets:[{
label:"Revenue Nu",
data:[200000,50000,30000,20000]
}]
}
})

</script>

</body>
</html>
