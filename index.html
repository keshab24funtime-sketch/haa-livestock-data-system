<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haa Livestock Enterprise Portal | Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; }
        .sidebar { background: #0f172a; transition: all 0.3s ease; z-index: 50; width: 280px; }
        .view { display: none; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: white; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 2rem; border: 1px solid #e2e8f0; }
        .form-input { width: 100%; border: 1px solid #cbd5e1; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; transition: all 0.2s; }
        .form-input:focus { border-color: #3b82f6; ring: 2px; outline: none; background: white; }
        label { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 0.3rem; display: block; }
        
        .calc-panel { background: #f8fafc; border-left: 4px solid #3b82f6; padding: 1rem; border-radius: 0.5rem; }
        .btn-save { background: #1e40af; color: white; font-weight: 800; padding: 1rem; border-radius: 0.75rem; width: 100%; transition: all 0.2s; }
        .btn-save:active { transform: scale(0.98); }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: fixed; height: 100vh; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0 !important; }
        }
    </style>
</head>
<body>

<div class="md:hidden bg-[#0f172a] text-white p-4 flex justify-between items-center sticky top-0 z-[60]">
    <span class="font-bold tracking-tighter text-lg">HAA LIVESTOCK</span>
    <button onclick="toggleMenu()" class="bg-blue-600 px-3 py-1 rounded text-sm">MENU</button>
</div>

<div class="flex">
    <aside id="sidebar" class="sidebar text-white fixed h-full p-6 overflow-y-auto">
        <h1 class="text-2xl font-black mb-8 border-b border-gray-700 pb-4 hidden md:block">HAA PORTAL</h1>
        <nav class="space-y-1">
            <button onclick="showView('dashboard')" class="block w-full text-left py-3 px-4 hover:bg-blue-800 rounded-lg transition font-medium">Dashboard</button>
            <div class="text-gray-500 text-[10px] font-bold uppercase mt-6 mb-2 px-4">Sector Data Entry</div>
            <button onclick="showView('dairy')" class="block w-full text-left py-2 px-4 hover:bg-blue-800 rounded-lg text-sm">1. Dairy Production</button>
            <button onclick="showView('ai')" class="block w-full text-left py-2 px-4 hover:bg-blue-800 rounded-lg text-sm">2. Dairy AI Record</button>
            <button onclick="showView('breeding')" class="block w-full text-left py-2 px-4 hover:bg-blue-800 rounded-lg text-sm">3. Natural Breeding</button>
            <button onclick="showView('fishery')" class="block w-full text-left py-2 px-4 hover:bg-blue-800 rounded-lg text-sm">6. Fishery Sector</button>
            <button onclick="showView('nutrition')" class="block w-full text-left py-2 px-4 hover:bg-blue-800 rounded-lg text-sm">7. Animal Nutrition</button>
            <button onclick="showView('api')" class="block w-full text-left py-2 px-4 hover:bg-blue-800 rounded-lg text-sm">8. Apiculture</button>
            <button onclick="showView('sheep')" class="block w-full text-left py-2 px-4 hover:bg-blue-800 rounded-lg text-sm">9. Sheep & Goat</button>
        </nav>
    </aside>

    <main class="main-content md:ml-[280px] w-full p-4 md:p-10">
        
        <section id="dashboard" class="view active">
            <h2 class="text-3xl font-black mb-6">District Summary</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="card bg-blue-600 text-white">
                    <label class="text-blue-100">Live Dairy Revenue</label>
                    <p class="text-4xl font-black">Nu. <span id="dash_rev">0</span></p>
                </div>
                <div class="card md:col-span-2">
                    <h3 class="font-bold mb-4">Quick Post (Announcements)</h3>
                    <div class="flex gap-2">
                        <input id="ann_input" class="form-input flex-1" placeholder="Type district update...">
                        <button onclick="postAnn()" class="bg-blue-600 text-white px-6 rounded-lg font-bold">Post</button>
                    </div>
                    <div id="ann_list" class="mt-4 space-y-2 text-sm italic text-gray-500"></div>
                </div>
            </div>
        </section>

        <section id="dairy" class="view">
            <h2 class="text-2xl font-black mb-6">1. Dairy Production</h2>
            <div class="card">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div><label>Month</label><select id="d_month" class="form-input"><option>July</option><option>August</option><option>September</option></select></div>
                    <div><label>Gewog</label><select id="d_gewog" class="form-input"><option>Bji</option><option>Katsho</option><option>Uesu</option><option>Samar</option><option>Gakiling</option><option>Sangbay</option></select></div>
                    <div><label>Farmers Group</label><input id="d_group" class="form-input"></div>
                    <div><label>Milking Cows</label><input id="d_cows" type="number" class="form-input"></div>
                </div>

                <div class="space-y-6">
                    <div class="calc-panel grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div><label>Milk Sold (Ltr)</label><input id="d_m_sold" type="number" oninput="calcDairy()" class="form-input"></div>
                        <div><label>Price (Nu/L)</label><input id="d_m_price" type="number" oninput="calcDairy()" class="form-input"></div>
                        <div class="flex items-end pb-2 font-bold text-blue-700">Milk Rev: Nu. <span id="r_m">0</span></div>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div><label>Butter Produced (Kg)</label><input id="d_b_p" type="number" class="form-input"></div>
                        <div><label>Butter Sold (Kg)</label><input id="d_b_s" type="number" oninput="calcDairy()" class="form-input"></div>
                        <div><label>Cheese Produced (Kg)</label><input id="d_c_p" type="number" class="form-input"></div>
                        <div><label>Cheese Sold (Kg)</label><input id="d_c_s" type="number" oninput="calcDairy()" class="form-input"></div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 border-t pt-4">
                        <div><label>Hard Chugo Sold</label><input id="d_hc" type="number" class="form-input"></div>
                        <div><label>Yoghurt Produced (L)</label><input id="d_yog" type="number" class="form-input"></div>
                        <div><label>Paneer Produced (Kg)</label><input id="d_pan" type="number" class="form-input"></div>
                    </div>
                </div>
                <button id="btn_dairy" onclick="saveRecord('dairy_prod', 'btn_dairy')" class="btn-save mt-8">SAVE RECORD</button>
            </div>
        </section>

        <section id="ai" class="view">
            <h2 class="text-2xl font-black mb-6">2. Dairy AI Record</h2>
            <div class="card grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label>AI Centre Name</label><input id="ai_name" class="form-input"></div>
                <div><label>Semen Type</label><select id="ai_type" class="form-input"><option>Sex-sorted</option><option>Normal</option></select></div>
                <div><label>No. of AI Performed</label><input id="ai_qty" type="number" class="form-input"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label>Male Born</label><input id="ai_m" type="number" class="form-input"></div>
                    <div><label>Female Born</label><input id="ai_f" type="number" class="form-input"></div>
                </div>
                <button id="btn_ai" onclick="saveRecord('ai_records', 'btn_ai')" class="btn-save md:col-span-2">SAVE AI LOG</button>
            </div>
        </section>

        <section id="nutrition" class="view">
            <h2 class="text-2xl font-black mb-6">7. Animal Nutrition</h2>
            <div class="card grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label>Pasture Developed (Acre)</label><input id="n_pasture" type="number" class="form-input"></div>
                <div><label>Fodder Plantation (Acre)</label><input id="n_fodder" type="number" class="form-input"></div>
                <div><label>Winter Oat (Acre)</label><input id="n_oat" type="number" class="form-input"></div>
                <div><label>Silage Produced (MT)</label><input id="n_silage" type="number" class="form-input"></div>
                <div><label>Hay Produced (MT)</label><input id="n_hay" type="number" class="form-input"></div>
                <div><label>Chaff Cutter Supplied</label><input id="n_chaff" type="number" class="form-input"></div>
                <button id="btn_nut" onclick="saveRecord('nutrition', 'btn_nut')" class="btn-save md:col-span-3">SAVE NUTRITION DATA</button>
            </div>
        </section>

        <section id="sheep" class="view">
            <h2 class="text-2xl font-black mb-6">9. Sheep & Goat Progress</h2>
            <div class="card grid grid-cols-2 md:grid-cols-4 gap-4">
                <div><label>Imp. Sheep Male</label><input id="s_im" type="number" class="form-input"></div>
                <div><label>Imp. Sheep Female</label><input id="s_if" type="number" class="form-input"></div>
                <div><label>Local Sheep Total</label><input id="s_loc" type="number" class="form-input"></div>
                <div><label>Wool Produced (Kg)</label><input id="s_wool" type="number" class="form-input"></div>
                <div><label>Mutton Produced (Kg)</label><input id="s_meat" type="number" class="form-input"></div>
                <div><label>Imp. Goat Female</label><input id="s_gt" type="number" class="form-input"></div>
                <button id="btn_sheep" onclick="saveRecord('sheep_goat', 'btn_sheep')" class="btn-save md:col-span-4">SAVE SHEEP RECORD</button>
            </div>
        </section>

    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    // REPLACE THIS WITH YOUR FIREBASE CONFIG FROM GOOGLE CONSOLE
    const firebaseConfig = { apiKey: "AIzaSy...", projectId: "haa-livestock" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // MENU CONTROLS
    window.toggleMenu = () => document.getElementById('sidebar').classList.toggle('open');
    window.showView = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(window.innerWidth < 768) toggleMenu();
        window.scrollTo(0,0);
    };

    // AUTO-CALCULATION LOGIC
    window.calcDairy = () => {
        const sold = Number(document.getElementById('d_m_sold').value) || 0;
        const price = Number(document.getElementById('d_m_price').value) || 0;
        const rev = sold * price;
        document.getElementById('r_m').innerText = rev.toLocaleString();
        document.getElementById('dash_rev').innerText = rev.toLocaleString();
    };

    // UNIVERSAL SAVE FUNCTION WITH VISUAL FEEDBACK
    window.saveRecord = async (collName, btnId) => {
        const btn = document.getElementById(btnId);
        const originalText = btn.innerText;
        btn.innerText = "UPLOADING TO CLOUD...";
        btn.style.background = "#ca8a04";

        const activeView = document.querySelector('.view.active');
        const inputs = activeView.querySelectorAll('input, select');
        let data = { timestamp: new Date(), entry_sector: collName };
        inputs.forEach(i => data[i.id] = i.value);

        try {
            await addDoc(collection(db, collName), data);
            btn.innerText = "✓ RECORD SAVED SUCCESSFULLY";
            btn.style.background = "#16a34a";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "#1e40af";
                inputs.forEach(i => i.value = "");
            }, 2500);
        } catch (e) {
            alert("Error: check your Firebase internet connection.");
            btn.innerText = originalText;
            btn.style.background = "#1e40af";
        }
    };

    window.postAnn = () => {
        const val = document.getElementById('ann_input').value;
        if(!val) return;
        const div = document.createElement('div');
        div.className = "p-3 bg-white border rounded shadow-sm text-blue-900 font-medium";
        div.innerText = "📢 " + val;
        document.getElementById('ann_list').prepend(div);
        document.getElementById('ann_input').value = "";
    };
</script>

</body>
</html>
