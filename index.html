<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haa Livestock System - Public Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(6, 78, 59, 0.98); backdrop-filter: blur(12px); }
        .sector-card { transition: all 0.3s ease; cursor: pointer; border: 1px solid #e2e8f0; }
        .sector-card:hover { transform: translateY(-5px); border-color: #10b981; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-emerald-900 px-4">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10">
            <h1 class="text-3xl font-black text-emerald-900 mb-2 text-center">Haa Livestock</h1>
            <p class="text-center text-xs text-slate-400 mb-8 font-bold uppercase tracking-widest">District Reporting Portal</p>
            
            <form onsubmit="event.preventDefault(); login();" class="space-y-4">
                <input type="text" id="username" required placeholder="Full Name / Visitor Name" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                
                <select id="roleSelect" required class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold text-emerald-800">
                    <option value="">Select Access Level...</option>
                    <option value="Visitor">Visitor (View & Download Only)</option>
                    <option value="Field Supervisor">Field Supervisor (Data Entry)</option>
                    <option value="LPO">LPO (System Master)</option>
                    <option value="DLO">DLO (Head of Sector)</option>
                    <option value="ADLO">ADLO (Asst. Head)</option>
                </select>

                <select id="gewogSelect" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none">
                    <option value="Haa HQ">Select Gewog...</option>
                    <option value="Bji">Bji</option><option value="Katsho">Katsho</option>
                    <option value="Uesu">Uesu</option><option value="Gakiling">Gakiling</option>
                    <option value="Sama">Sama</option><option value="Sangbay">Sangbay</option>
                </select>

                <button type="submit" class="w-full bg-emerald-700 text-white font-black py-4 rounded-2xl uppercase tracking-widest text-sm shadow-lg hover:bg-emerald-800 transition">Enter Portal</button>
            </form>
        </div>
    </div>

    <div id="dashboard" class="hidden min-h-screen pb-20">
        <nav class="glass-nav text-white px-8 py-4 flex justify-between items-center sticky top-0 z-50 no-print">
            <div class="flex flex-col">
                <span class="text-xl font-black tracking-tighter">HAA LIVESTOCK</span>
                <span id="userDisplay" class="text-[10px] font-bold opacity-80"></span>
            </div>
            <div class="flex gap-3">
                <button onclick="printReport()" class="bg-white/20 hover:bg-white/40 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-tighter">Print PDF</button>
                <button onclick="location.reload()" class="bg-rose-500 px-4 py-2 rounded-xl text-xs font-bold">Logout</button>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-6 md:p-10">
            <div id="announcementBar" class="mb-8 p-4 bg-amber-50 border border-amber-200 rounded-3xl flex items-center justify-between no-print">
                <div class="flex items-center gap-3">
                    <span class="text-xl">📢</span>
                    <p id="announcementText" class="text-sm font-bold text-amber-900 italic">Welcome! Please use the 'Print PDF' button to download latest reports.</p>
                </div>
            </div>

            <section class="mb-12 no-print">
                <h2 class="text-2xl font-black mb-6">📂 Livestock Sectors</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                    <div onclick="checkAccessAndOpen('Dairy Production')" class="sector-card p-6 bg-white rounded-3xl text-center">
                        <span class="text-3xl block mb-2">🥛</span><span class="text-[9px] font-black uppercase">Dairy</span>
                    </div>
                    <div onclick="checkAccessAndOpen('Dairy AI')" class="sector-card p-6 bg-white rounded-3xl text-center">
                        <span class="text-3xl block mb-2">💉</span><span class="text-[9px] font-black uppercase">AI</span>
                    </div>
                    <div onclick="checkAccessAndOpen('Fishery')" class="sector-card p-6 bg-white rounded-3xl text-center">
                        <span class="text-3xl block mb-2">🐟</span><span class="text-[9px] font-black uppercase">Fishery</span>
                    </div>
                    <div onclick="checkAccessAndOpen('Nutrition')" class="sector-card p-6 bg-white rounded-3xl text-center">
                        <span class="text-3xl block mb-2">🌱</span><span class="text-[9px] font-black uppercase">Nutrition</span>
                    </div>
                </div>
            </section>

            <section id="printableArea">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h2 class="text-2xl font-black">📊 Live Status Report</h2>
                        <p class="text-xs text-slate-400 font-bold uppercase">Haa District Livestock Statistics</p>
                    </div>
                    <button onclick="exportToCSV()" class="no-print bg-emerald-100 text-emerald-700 px-4 py-2 rounded-xl text-[10px] font-bold uppercase">Download Excel (.csv)</button>
                </div>
                <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
            </section>
        </main>
    </div>

    <script>
        let currentUser = { name: "", role: "", gewog: "" };
        let records = [
            // Dummy data for visitors to see immediately
            { id: 101, sector: "Dairy Production", month: "2025-03", data: {"Milk (l)": "4500", "Butter (kg)": "120"}, submittedBy: "System", gewog: "Bji", headRemarks: "Verified by DLO" }
        ];

        function login() {
            currentUser = {
                name: document.getElementById('username').value,
                role: document.getElementById('roleSelect').value,
                gewog: document.getElementById('gewogSelect').value
            };
            document.getElementById('userDisplay').innerText = `${currentUser.name} | ${currentUser.gewog} (${currentUser.role})`;
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            renderGallery();
        }

        function checkAccessAndOpen(sector) {
            if(currentUser.role === 'Visitor') {
                alert("Visitor Mode: You can view and download data, but entry is restricted to officials.");
                return;
            }
            if(['DLO', 'ADLO'].includes(currentUser.role)) {
                alert("Head of Sector: Please review existing data in the gallery.");
                return;
            }
            // openForm logic...
        }

        function renderGallery() {
            const container = document.getElementById('gallery');
            container.innerHTML = records.length ? "" : "<p class='text-slate-400 italic'>No reports found for this period.</p>";
            
            records.forEach(r => {
                container.innerHTML += `
                    <div class="bg-white p-6 rounded-[2rem] border-2 border-slate-100 shadow-sm flex flex-col">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-[9px] font-black bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full uppercase">${r.month}</span>
                            <span class="text-[8px] font-bold text-slate-300">ID: ${r.id}</span>
                        </div>
                        <h3 class="font-black text-lg text-emerald-900">${r.sector}</h3>
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-4">${r.gewog} Gewog | By: ${r.submittedBy}</p>
                        
                        <div class="bg-slate-50 rounded-2xl p-4 text-[11px] space-y-1 mb-4 flex-1">
                            ${Object.entries(r.data).map(([key, val]) => `<div><b class="text-slate-400 font-medium">${key}:</b> ${val}</div>`).join('')}
                        </div>
                        ${r.headRemarks ? `<div class="p-3 bg-amber-50 rounded-xl border-l-4 border-amber-400 text-[10px] italic">"${r.headRemarks}"</div>` : ''}
                    </div>
                `;
            });
        }

        function printReport() {
            window.print();
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Month,Gewog,Sector,Data\n";
            records.forEach(r => {
                let dataString = JSON.stringify(r.data).replace(/,/g, ";");
                csvContent += `${r.month},${r.gewog},${r.sector},${dataString}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Haa_Livestock_Report.csv");
            document.body.appendChild(link);
            link.click();
        }
    </script>
</body>
</html>
