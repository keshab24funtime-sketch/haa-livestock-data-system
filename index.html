<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Haa Livestock DRP Portal</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:#0f172a;
}

.sidebar{
width:280px;
background:#1e293b;
color:white;
position:fixed;
height:100vh;
padding:2rem;
overflow-y:auto;
}

.main{
margin-left:280px;
padding:2rem;
background:#f8fafc;
min-height:100vh;
}

.card{
background:white;
padding:1.5rem;
border-radius:1rem;
box-shadow:0 10px 25px rgba(0,0,0,0.05);
margin-bottom:2rem;
}

.form-input{
width:100%;
border:1px solid #cbd5e1;
padding:0.6rem;
border-radius:8px;
font-size:0.85rem;
}

.nav-btn{
display:block;
width:100%;
text-align:left;
padding:8px;
margin-bottom:5px;
border-radius:8px;
font-size:12px;
}

.nav-btn:hover{
background:#334155;
}

.nav-btn.active{
background:#1d4ed8;
}

.calc-row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr;
gap:6px;
padding:6px;
background:#eff6ff;
border-radius:6px;
align-items:center;
}

.btn{
background:#1e40af;
color:white;
padding:10px;
border-radius:8px;
font-weight:bold;
width:100%;
}

.btn:hover{
background:#1d4ed8;
}

</style>
</head>

<body>

<!-- STAFF LOGIN MODAL -->

<div id="signup_modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">

<div class="bg-white p-8 rounded-2xl w-full max-w-md">

<h2 class="text-xl font-black mb-2">Staff Access Request</h2>

<p class="text-xs text-slate-400 mb-6 uppercase font-bold">Haa Livestock System</p>

<div class="space-y-3">

<input id="reg_user" placeholder="Full Name" class="form-input">

<input id="reg_email" placeholder="Official Email" class="form-input">

<select id="reg_role" class="form-input">
<option>STAFF</option>
<option>FIELD SUPERVISOR</option>
<option>LPO</option>
<option>DLO</option>
<option>ADLO</option>
</select>

<button onclick="requestAccess()" class="btn">Submit for Approval</button>

<button onclick="bypassForAdmin()" class="text-xs mt-2 w-full">Administrator Bypass</button>

</div>

</div>
</div>

<!-- SIDEBAR -->

<div class="sidebar">

<h1 class="text-xl font-black">HAA DISTRICT</h1>
<p class="text-xs text-blue-400">Livestock Portal</p>

<div class="mt-6">

<button class="nav-btn active" onclick="showView('dash',this)">Dashboard</button>

<p class="text-xs text-slate-400 mt-4">PRODUCTION</p>

<button class="nav-btn" onclick="showView('dairy',this)">Dairy</button>
<button class="nav-btn" onclick="showView('fish',this)">Fishery</button>
<button class="nav-btn" onclick="showView('api',this)">Apiculture</button>
<button class="nav-btn" onclick="showView('nutri',this)">Nutrition</button>
<button class="nav-btn" onclick="showView('sheep',this)">Sheep & Goat</button>

<p class="text-xs text-slate-400 mt-4">ADMIN</p>

<button class="nav-btn" onclick="showView('staff',this)">Staff Directory</button>
<button class="nav-btn" onclick="showView('admin_gate',this)">Admin Panel</button>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- DASHBOARD -->

<section id="dash" class="view card">

<h2 class="font-black text-lg mb-4">District Dashboard</h2>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4">

<div class="bg-blue-900 text-white p-4 rounded-xl">
<label>Total Dairy Revenue</label>
<p id="dairy_total" class="text-xl font-black">0</p>
</div>

<div class="bg-amber-400 text-white p-4 rounded-xl">
<label>Honey Revenue</label>
<p id="api_total" class="text-xl font-black">0</p>
</div>

<div class="bg-cyan-500 text-white p-4 rounded-xl">
<label>Fish Production</label>
<p id="fish_total" class="text-xl font-black">0</p>
</div>

<div class="bg-emerald-600 text-white p-4 rounded-xl">
<label>Sheep/Goat Output</label>
<p id="sheep_total" class="text-xl font-black">0</p>
</div>

</div>

</section>

<!-- DAIRY -->

<section id="dairy" class="view card hidden">

<h3 class="font-black mb-4">Dairy Production</h3>

<div class="space-y-2">

<div class="calc-row">
<span>Milk</span>
<input type="number" class="qty-input form-input" oninput="runAutoCalc('dairy')">
<input type="number" class="price-input form-input" oninput="runAutoCalc('dairy')">
<span>Nu <span class="subtotal-display">0</span></span>
</div>

<div class="calc-row">
<span>Butter</span>
<input type="number" class="qty-input form-input" oninput="runAutoCalc('dairy')">
<input type="number" class="price-input form-input" oninput="runAutoCalc('dairy')">
<span>Nu <span class="subtotal-display">0</span></span>
</div>

</div>

<button onclick="syncDashboard('dairy')" class="btn mt-4">Live Sync</button>

</section>

<!-- APICULTURE -->

<section id="api" class="view card hidden">

<h3 class="font-black mb-4">Apiculture</h3>

<div class="calc-row">

<span>Honey Sold</span>

<input class="qty-input form-input" type="number" oninput="runAutoCalc('api')">

<input class="price-input form-input" type="number" oninput="runAutoCalc('api')">

<span>Nu <span class="subtotal-display">0</span></span>

</div>

<button onclick="syncDashboard('api')" class="btn mt-4">Live Sync</button>

</section>

<!-- FISHERY -->

<section id="fish" class="view card hidden">

<h3 class="font-black mb-4">Fishery</h3>

<input id="fish_prod" type="number" class="form-input">

<button onclick="syncFish()" class="btn mt-4">Sync Fish Data</button>

</section>

<!-- NUTRITION -->

<section id="nutri" class="view card hidden">

<h3 class="font-black mb-4">Animal Nutrition</h3>

<div class="grid grid-cols-2 gap-4">

<input placeholder="Pasture Acre" class="form-input">
<input placeholder="Fodder Slips" class="form-input">
<input placeholder="Silage MT" class="form-input">
<input placeholder="TMR MT" class="form-input">

</div>

</section>

<!-- SHEEP -->

<section id="sheep" class="view card hidden">

<h3 class="font-black mb-4">Sheep & Goat</h3>

<input id="sheep_prod" type="number" class="form-input">

<button onclick="syncSheep()" class="btn mt-4">Sync Output</button>

</section>

<!-- STAFF -->

<section id="staff" class="view card hidden">

<h3 class="font-black mb-4">Staff Directory</h3>

<div class="grid grid-cols-3 gap-4">

<input id="st_name" placeholder="Name" class="form-input">
<input id="st_des" placeholder="Designation" class="form-input">
<input id="st_unit" placeholder="Duty Station" class="form-input">

</div>

<button onclick="addStaff()" class="btn mt-4">Add Staff</button>

<div id="staff_list" class="mt-4"></div>

</section>

<!-- ADMIN PANEL -->

<section id="admin_gate" class="view card hidden">

<h3 class="font-black mb-4">Pending Staff Requests</h3>

<div id="request_list"></div>

</section>

</div>

<script>

function showView(id,btn){

document.querySelectorAll(".view").forEach(v=>v.classList.add("hidden"))

document.getElementById(id).classList.remove("hidden")

document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"))

if(btn)btn.classList.add("active")

}

function runAutoCalc(sector){

let total=0

document.querySelectorAll("#"+sector+" .calc-row").forEach(row=>{

const q=row.querySelector(".qty-input").value||0
const p=row.querySelector(".price-input").value||0

const sub=q*p

row.querySelector(".subtotal-display").innerText=sub

total+=sub

})

document.getElementById(sector+"_total")?.innerText=total

}

function syncDashboard(sector){

const total=document.getElementById(sector+"_total").innerText

document.getElementById(sector+"_total").innerText=total

alert("Synced to dashboard")

}

function syncFish(){

document.getElementById("fish_total").innerText=
document.getElementById("fish_prod").value

}

function syncSheep(){

document.getElementById("sheep_total").innerText=
document.getElementById("sheep_prod").value

}

function addStaff(){

const name=document.getElementById("st_name").value
const des=document.getElementById("st_des").value

const div=document.createElement("div")

div.innerHTML="<b>"+name+"</b> - "+des

document.getElementById("staff_list").appendChild(div)

}

function bypassForAdmin(){

document.getElementById("signup_modal").style.display="none"

}

function requestAccess(){

const name=document.getElementById("reg_user").value
const role=document.getElementById("reg_role").value

const id="req"+Date.now()

const card=`
<div id="${id}" class="p-3 border rounded flex justify-between">
<div>${name} - ${role}</div>
<button onclick="approve('${id}','${name}')">Approve</button>
</div>
`

document.getElementById("request_list").innerHTML+=card

alert("Request submitted")

}

function approve(id,name){

document.getElementById(id).remove()

alert(name+" approved")

}

</script>

</body>
</html>
